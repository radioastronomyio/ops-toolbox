# Ops Toolbox nginx server config (used by the Docker runtime image).
#
# Mirrors staticwebapp.config.json: serve the per-route prerendered HTML when it
# exists (dist/<route>/index.html), and fall back to the SPA shell for unknown
# routes so client-side routing resolves (unknown paths hit the React 404 view).
#
# The prerender emits dist/<route>/index.html for every tool route plus /about.
# `try_files $uri $uri/ /index.html;` with `index index.html;` serves that file
# for known routes and only falls through to the shell when nothing matches.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Compress text payloads (JS/CSS/JSON/SVG/HTML).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/xhtml+xml
        image/svg+xml;

    # ---- Client-side routing: prerendered route first, SPA shell last ----
    #
    # Order matters. `$uri/index.html` is tested before `$uri` so a request for
    # `/subnet-calculator` resolves directly to the prerendered file instead of
    # matching the directory and triggering a 301 trailing-slash redirect. Only
    # when no file and no prerendered route matches does it fall through to the
    # SPA shell, which lets React Router render the 404 view for unknown paths.
    location = / {
        # Home is prerendered at /index.html (site-default meta).
        try_files /index.html =404;
    }

    location / {
        try_files $uri/index.html $uri /index.html;
    }

    # ---- Hashed static assets: immutable, never fall back to the shell ----
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Static files at root: serve directly, no SPA rewrite ----
    location ~* \.(?:png|ico|svg|webmanifest|txt|webp|xml)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # The prerendered HTML files are text; default caching, allow revalidation.
    location ~* /index\.html$ {
        add_header Cache-Control "no-cache";
    }
}
